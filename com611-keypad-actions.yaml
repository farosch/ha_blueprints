blueprint:
  name: COM611 Keypad - 20 Action Rules
  description: >-
    Handle esphome.com611 events with up to 20 independent rules and inline
    actions. Enable each rule and select its device addresses, keypad event,
    codes, and actions. Every enabled rule requires at least one nonblank device
    address. Bell uses ring. Function and bell codes must contain
    1-8 ASCII digits and match exactly. Door Button requires an empty event code
    and does not validate a code. All matching rules run in numeric order.
    Unconfigured address/event combinations are ignored. Rejection actions and
    cooldown are shared across all rules and devices. Events during actions or
    cooldown are ignored. No rules or actions are enabled by default.
    The keypad beep acknowledges receipt, not authorization. Keep real codes
    out of version control; event payloads contain codes. Trace storage is disabled.
  domain: automation
  homeassistant:
    min_version: "2024.10.0"
  input:
    rule_01:
      name: Rule 01
      collapsed: true
      input:
        rule_01_enabled:
          name: Enabled
          default: false
          selector:
            boolean: {}
        rule_01_addresses:
          name: Device Addresses (Required)
          default: []
          selector:
            text:
              multiple: true
        rule_01_event:
          name: Keypad Event
          default: function
          selector:
            select:
              options: [function, ring, door_button]
        rule_01_codes:
          name: Valid Codes
          default: []
          selector:
            text:
              multiple: true
        rule_01_actions:
          name: Actions
          default: []
          selector:
            action: {}
