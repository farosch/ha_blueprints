      codes: !input rule_18_codes
    - id: 19
      enabled: !input rule_19_enabled
      addresses: !input rule_19_addresses
      event: !input rule_19_event
      codes: !input rule_19_codes
    - id: 20
      enabled: !input rule_20_enabled
      addresses: !input rule_20_addresses
      event: !input rule_20_event
      codes: !input rule_20_codes
  event_rules: >-
    {% set matched = namespace(rules=[]) %}
    {% for rule in configured_rules %}
      {% if rule.enabled
            and rule.addresses is sequence
            and rule.addresses is not string
            and rule.addresses is not mapping
            and rule.addresses | length > 0
            and (rule.addresses | select('string') | list | length)
              == (rule.addresses | length)
            and '' not in (rule.addresses | map('trim') | list)
            and trigger.event.data.get('address') is not none
            and trigger.event.data.get('address') | string in
                (rule.addresses | map('string') | list)
            and trigger.event.data.get('action') == rule.event
            and rule.event in ['function', 'ring', 'door_button'] %}
        {% set matched.rules = matched.rules + [rule] %}
      {% endif %}
    {% endfor %}
    {{ matched.rules }}
  matching_rules: >-
    {% set matched = namespace(ids=[]) %}
    {% set code = trigger.event.data.get('code') %}
    {% for rule in event_rules %}
      {% if (rule.event == 'door_button' and code == '')
            or (rule.event in ['function', 'ring']
                and rule.codes is sequence
                and rule.codes is not string
                and rule.codes is not mapping
                and code is string and 1 <= code | length <= 8
                and code.isascii() and code.isdigit()
                and code in rule.codes) %}
        {% set matched.ids = matched.ids + [rule.id] %}
      {% endif %}
    {% endfor %}
    {{ matched.ids }}

triggers:
  - trigger: event
    event_type: esphome.com611

conditions:
  - condition: template
    value_template: "{{ event_rules | length > 0 }}"

actions:
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ matching_rules | length > 0 }}"
        sequence:
          - repeat:
              for_each: "{{ matching_rules }}"
              sequence:
                - choose:
                    - conditions: "{{ repeat.item == 1 }}"
                      sequence: !input rule_01_actions
                    - conditions: "{{ repeat.item == 2 }}"
                      sequence: !input rule_02_actions
                    - conditions: "{{ repeat.item == 3 }}"
                      sequence: !input rule_03_actions
                    - conditions: "{{ repeat.item == 4 }}"
                      sequence: !input rule_04_actions
                    - conditions: "{{ repeat.item == 5 }}"
                      sequence: !input rule_05_actions
                    - conditions: "{{ repeat.item == 6 }}"
                      sequence: !input rule_06_actions
                    - conditions: "{{ repeat.item == 7 }}"
                      sequence: !input rule_07_actions
                    - conditions: "{{ repeat.item == 8 }}"
                      sequence: !input rule_08_actions
                    - conditions: "{{ repeat.item == 9 }}"
                      sequence: !input rule_09_actions
                    - conditions: "{{ repeat.item == 10 }}"
                      sequence: !input rule_10_actions
                    - conditions: "{{ repeat.item == 11 }}"
                      sequence: !input rule_11_actions
                    - conditions: "{{ repeat.item == 12 }}"
                      sequence: !input rule_12_actions
                    - conditions: "{{ repeat.item == 13 }}"
                      sequence: !input rule_13_actions
                    - conditions: "{{ repeat.item == 14 }}"
                      sequence: !input rule_14_actions
                    - conditions: "{{ repeat.item == 15 }}"
                      sequence: !input rule_15_actions
                    - conditions: "{{ repeat.item == 16 }}"
                      sequence: !input rule_16_actions
                    - conditions: "{{ repeat.item == 17 }}"
                      sequence: !input rule_17_actions
                    - conditions: "{{ repeat.item == 18 }}"
                      sequence: !input rule_18_actions
                    - conditions: "{{ repeat.item == 19 }}"
                      sequence: !input rule_19_actions
                    - conditions: "{{ repeat.item == 20 }}"
                      sequence: !input rule_20_actions
    default: !input rejected_actions
  - delay: !input cooldown