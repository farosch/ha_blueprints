blueprint:
  name: Siedle COM611 Keypad on ESP
  description: >-
    Respond to Siedle COM611 keypad events sent by an ESP32 through ESPHome
    (esphome.com611). Create named rules with device addresses, a keypad event,
    authorized codes, and a script, then enable each rule explicitly.
    Function and bell events require an exact code match. Door-button rules
    authorize an empty-code button event without checking a code list.

    Run all matching rules or only the first match, in list order. Scripts receive
    keypad.address, keypad.event, and keypad.rule as structured text metadata;
    entered codes and configured code lists are not forwarded. Unconfigured
    address/event combinations are ignored. Attempts while the automation is
    running or waiting through its shared cooldown are discarded, not queued.

    Rejections can be reported in Activity without entered codes. Automation
    trace storage is disabled, but incoming event payloads still contain codes.
    Keep real codes out of version control, rule names, and custom logs.
    The keypad beep acknowledges receipt, not authorization.
  domain: automation
  homeassistant:
    min_version: "2026.9.4"
  input:
    rules:
      name: Keypad Rules
      description: >-
        Add one rule per address/event/code combination and choose the script
        to run. Give each rule a nonblank name and turn on Enabled; disabled
        rules do not match or cause rejection feedback. List order sets priority.

        Enter each address as a separate text entry using the address from the
        incoming event, not Home Assistant's internal device ID. At least one
        nonblank address is required; any listed device can trigger the rule.
        Select Function (function), Bell / Ring (ring), or Door Button (door_button).

        For Function and Bell, enter each authorized code separately as text:
        1-8 ASCII digits, with leading zeros preserved and no surrounding spaces.
        An empty code list authorizes neither event. Door Button ignores this
        list and requires an empty code in the incoming event. Scripts receive
        only keypad.address, keypad.event, and keypad.rule. An empty rule list
        handles no events. Keep codes out of rule names.
      default: []
      selector:
        object:
          multiple: true
          label_field: name
          description_field: enabled
          fields:
            name:
              label: Rule Name (Required)
              required: true
              selector:
                text:
            enabled:
              label: Enabled
              required: true
              selector:
                boolean:
            addresses:
              label: Device Addresses (Required)
              required: true
              selector:
                text:
                  multiple: true
            event:
              label: Keypad Event
              required: true
              selector:
                select:
                  options:
                    - label: Function (F)
                      value: function
                    - label: Bell / Ring
                      value: ring
                    - label: Door Button
                      value: door_button
            codes:
              label: Valid Codes
              selector:
                text:
                  multiple: true
            script:
              label: Script to Run
              required: true
              selector:
                entity:
                  filter:
                    domain: script
    match_mode:
      name: Matching Mode
      description: >-
        All matches runs every matching enabled rule in list order, waiting for
        each script to finish. First match runs only the first matching enabled
        rule. Reorder rules to change priority; disabled or nonmatching rules
        are skipped. An action error can stop the remaining scripts.
      default: all
      selector:
        select:
          options:
            - label: Run All Matching Rules
              value: all
            - label: Run First Matching Rule Only
              value: first
    report_rejections:
      name: Report Rejections in Activity
      description: >-
        Add an Activity entry when an enabled rule matches the address and event,
        but no rule accepts the attempt. Includes the address, event, applicable
        rule names, and a reason: invalid_code_format, code_not_allowed, or
        unexpected_door_button_code. Entered codes are omitted. Turning this off
        does not disable Rejected Actions. Unconfigured or disabled rules, and
        attempts discarded while busy, are not reported. Keep codes out of rule
        names and custom feedback actions.
      default: true
      selector:
        boolean:
    rejected_actions:
      name: Rejected Actions
      description: >-
        Run these actions once when at least one enabled rule matches the device
        address and keypad event, but none accepts the attempt. This includes
        malformed or unauthorized function/bell codes and door-button events
        with a missing or nonempty code. Runs independently of Activity reporting.
        Unconfigured address/event combinations are ignored. Use feedback only,
        such as a notification or indicator; never unlock on rejection or log codes.
      default: []
      selector:
        action:
    cooldown:
      name: Attempt Cooldown
      description: >-
        Wait this many seconds after accepted scripts or rejected actions finish.
        The cooldown is shared across all rules and devices, not per keypad.
        Incoming attempts during actions or this delay are discarded, not queued.
        The same code can be used again once the automation finishes. An action
        error can abort the run before this delay starts.
      default: 5
      selector:
        number:
          min: 1
          max: 300
          unit_of_measurement: seconds
          mode: box

mode: single
max_exceeded: silent

trace:
  stored_traces: 0

variables:
  rules: !input rules
  match_mode: !input match_mode
  report_rejections: !input report_rejections
  event_rules: >-
    {% set matched = namespace(rules=[]) %}
    {% for rule in rules %}
      {% if rule is mapping
        and rule.get('enabled', false) is sameas true
        and rule.get('name') is string and rule.get('name') | trim != ''
            and rule.get('addresses', []) is sequence
            and rule.get('addresses', []) is not string
            and rule.get('addresses', []) is not mapping
            and rule.get('addresses', []) | length > 0
            and (rule.get('addresses', []) | select('string') | list | length)
              == (rule.get('addresses', []) | length)
            and '' not in (rule.get('addresses', []) | map('trim') | list)
            and trigger.event.data.get('address') is not none
            and trigger.event.data.get('address') | string in
                (rule.get('addresses', []) | map('string') | list)
            and trigger.event.data.get('action') == rule.get('event')
            and rule.get('event') in ['function', 'ring', 'door_button'] %}
        {% set matched.rules = matched.rules + [rule] %}
      {% endif %}
    {% endfor %}
    {{ matched.rules }}
  matching_rules: >-
    {% set matched = namespace(rules=[]) %}
    {% set code = trigger.event.data.get('code') %}
    {% for rule in event_rules %}
      {% if (rule.get('event') == 'door_button' and code == '')
            or (rule.get('event') in ['function', 'ring']
                and rule.get('codes', []) is sequence
                and rule.get('codes', []) is not string
                and rule.get('codes', []) is not mapping
                and code is string and 1 <= code | length <= 8
                and code.isascii() and code.isdigit()
                and code in rule.get('codes', [])) %}
        {% set matched.rules = matched.rules + [rule] %}
      {% endif %}
    {% endfor %}
    {{ matched.rules }}

  selected_rules: >-
    {{ matching_rules[:1] if match_mode == 'first' else matching_rules }}
  rejection_reason: >-
    {% set code = trigger.event.data.get('code') %}
    {% if trigger.event.data.get('action') == 'door_button' %}
      unexpected_door_button_code
    {% elif code is not string or not (1 <= code | length <= 8)
            or not code.isascii() or not code.isdigit() %}
      invalid_code_format
    {% else %}
      code_not_allowed
    {% endif %}

triggers:
  - trigger: event
    event_type: esphome.com611

conditions:
  - condition: template
    value_template: "{{ event_rules | length > 0 }}"

actions:
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ selected_rules | length > 0 }}"
        sequence:
          - repeat:
              for_each: "{{ selected_rules }}"
              sequence:
                - action: "{{ repeat.item.script }}"
                  data:
                    keypad: >-
                      {{ {'address': trigger.event.data.get('address') | string,
                          'event': trigger.event.data.get('action'),
                          'rule': repeat.item.name} }}
    default:
      - if: "{{ report_rejections }}"
        then:
          - action: logbook.log
            data:
              name: COM611 Keypad
              message: >-
                Rejected; address={{ trigger.event.data.get('address') }};
                event={{ trigger.event.data.get('action') }};
                reason={{ rejection_reason }};
                rules={{ event_rules | map(attribute='name') | join(', ') }}
      - sequence: !input rejected_actions
  - delay: !input cooldown