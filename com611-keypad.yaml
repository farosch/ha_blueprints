blueprint:
  name: Siedle COM611 Keypad on ESP
  description: >-
    Handle esphome.com611 function, bell, or door-button events in Home Assistant.
    Add independent rules with their own addresses, event, codes, and script.
    Every rule requires at least one nonblank device address.
    Enable rules explicitly and choose all matches or the first match in list
    order. Function and bell events require a
    valid code. Door-button rules explicitly run without a code.
    The keypad beep acknowledges receipt, not authorization.
    Attempts during the shared cooldown are ignored. Scripts receive structured
    address, event, and rule metadata without codes. Rejections can be reported
    in Activity without codes. Keep real codes out of version control; event
    payloads contain codes. Keep codes out of rule names.
  domain: automation
  homeassistant:
    min_version: "2026.9.4"
  input:
    rules:
      name: Keypad Rules
      description: >-
        Each enabled rule runs its selected script when its addresses, event, and code
        match. Bell uses the event value ring. Codes are not used for Door Button.
        No events are handled when this list is empty.
      default: []
      selector:
        object:
          multiple: true
          label_field: name
          fields:
            name:
              label: Rule Name (Required)
              required: true
              selector:
                text:
            enabled:
              label: Enabled
              required: true
              selector:
                boolean:
            addresses:
              label: Device Addresses (Required)
              required: true
              selector:
                text:
                  multiple: true
            event:
              label: Keypad Event
              required: true
              selector:
                select:
                  options:
                    - label: Function (F)
                      value: function
                    - label: Bell / Ring
                      value: ring
                    - label: Door Button
                      value: door_button
            codes:
              label: Valid Codes
              selector:
                text:
                  multiple: true
            script:
              label: Script to Run
              required: true
              selector:
                entity:
                  filter:
                    domain: script
    match_mode:
      name: Matching Mode
      default: all
      selector:
        select:
          options:
            - label: Run All Matching Rules
              value: all
            - label: Run First Matching Rule Only
              value: first
    report_rejections:
      name: Report Rejections in Activity
      description: >-
        Reports address, event, rule names, and rejection reason. Never reports
        the code. Keep codes out of rule names and custom feedback actions.
      default: true
      selector:
        boolean:
    rejected_actions:
      name: Rejected Actions
      description: >-
        Runs once when a configured address/event has no matching code rule.
        Configure feedback only; never unlock on rejection.
      default: []
      selector:
        action:
    cooldown:
      name: Attempt Cooldown
      description: >-
        Shared across all rules and devices, after either result.
        Repeated codes work after this delay.
      default: 5
      selector:
        number:
          min: 1
          max: 300
          unit_of_measurement: seconds
          mode: box

mode: single
max_exceeded: silent

trace:
  stored_traces: 0

variables:
  rules: !input rules
  match_mode: !input match_mode
  report_rejections: !input report_rejections
  event_rules: >-
    {% set matched = namespace(rules=[]) %}
    {% for rule in rules %}
      {% if rule is mapping
        and rule.get('enabled', false) is sameas true
        and rule.get('name') is string and rule.get('name') | trim != ''
            and rule.get('addresses', []) is sequence
            and rule.get('addresses', []) is not string
            and rule.get('addresses', []) is not mapping
            and rule.get('addresses', []) | length > 0
            and (rule.get('addresses', []) | select('string') | list | length)
              == (rule.get('addresses', []) | length)
            and '' not in (rule.get('addresses', []) | map('trim') | list)
            and trigger.event.data.get('address') is not none
            and trigger.event.data.get('address') | string in
                (rule.get('addresses', []) | map('string') | list)
            and trigger.event.data.get('action') == rule.get('event')
            and rule.get('event') in ['function', 'ring', 'door_button'] %}
        {% set matched.rules = matched.rules + [rule] %}
      {% endif %}
    {% endfor %}
    {{ matched.rules }}
  matching_rules: >-
    {% set matched = namespace(rules=[]) %}
    {% set code = trigger.event.data.get('code') %}
    {% for rule in event_rules %}
      {% if (rule.get('event') == 'door_button' and code == '')
            or (rule.get('event') in ['function', 'ring']
                and rule.get('codes', []) is sequence
                and rule.get('codes', []) is not string
                and rule.get('codes', []) is not mapping
                and code is string and 1 <= code | length <= 8
                and code.isascii() and code.isdigit()
                and code in rule.get('codes', [])) %}
        {% set matched.rules = matched.rules + [rule] %}
      {% endif %}
    {% endfor %}
    {{ matched.rules }}

  selected_rules: >-
    {{ matching_rules[:1] if match_mode == 'first' else matching_rules }}
  rejection_reason: >-
    {% set code = trigger.event.data.get('code') %}
    {% if trigger.event.data.get('action') == 'door_button' %}
      unexpected_door_button_code
    {% elif code is not string or not (1 <= code | length <= 8)
            or not code.isascii() or not code.isdigit() %}
      invalid_code_format
    {% else %}
      code_not_allowed
    {% endif %}

triggers:
  - trigger: event
    event_type: esphome.com611

conditions:
  - condition: template
    value_template: "{{ event_rules | length > 0 }}"

actions:
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ selected_rules | length > 0 }}"
        sequence:
          - repeat:
              for_each: "{{ selected_rules }}"
              sequence:
                - action: "{{ repeat.item.script }}"
                  data:
                    keypad: >-
                      {{ {'address': trigger.event.data.get('address') | string,
                          'event': trigger.event.data.get('action'),
                          'rule': repeat.item.name} }}
    default:
      - if: "{{ report_rejections }}"
        then:
          - action: logbook.log
            data:
              name: COM611 Keypad
              message: >-
                Rejected; address={{ trigger.event.data.get('address') }};
                event={{ trigger.event.data.get('action') }};
                reason={{ rejection_reason }};
                rules={{ event_rules | map(attribute='name') | join(', ') }}
      - sequence: !input rejected_actions
  - delay: !input cooldown